<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARUNA Trophy Ledger — GTA VI on PlayStation 5</title>
<link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAYAAAAf8/9hAAAAaElEQVR42mPk5hX5z0ABYGKgEBA04OkyB/INgGnGZwgTsTbjMoSJFGdjE2ci1c/o8kykaMamjolUzejq4QZIRx0gyQCYeiZsgsRqxhqIhAxBl2ciRhE+cSZibcJlKBMxzsXnLUZKszMAj8EoQB/TIfcAAAAASUVORK5CYII=">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">◆</span>
    <span class="brand-text"><strong>ARUNA TROPHY LEDGER</strong><small>GRAND THEFT AUTO VI · PLAYSTATION 5</small></span>
  </div>
  <div class="header-progress">
    <div class="progress-labels"><span id="progress-count">0 / 55 earned</span><span id="progress-pct">0%</span></div>
    <div class="progress-track"><span id="progress-fill"></span></div>
  </div>
  <div class="header-actions">
    <button id="btn-export" class="btn" type="button" title="Download progress as JSON">Export</button>
    <label class="btn file-btn" for="file-import" title="Load a progress JSON file">Import<input id="file-import" type="file" accept="application/json"></label>
    <button id="btn-spoiler" class="btn" type="button" aria-pressed="false" title="Hide unearned story trophy names and descriptions">Spoilers: OFF</button>
    <button id="btn-reset" class="reset" type="button" title="Clear saved progress">Reset</button>
  </div>
</header>

<div class="stats" id="stats"></div>

<nav class="tabs">
  <button class="tab is-active" type="button" data-view="ledger">Ledger</button>
  <button class="tab" type="button" data-view="roadmap">Roadmap</button>
  <button class="tab" type="button" data-view="collectibles">Collectibles</button>
  <span class="tabs-note">Offline · progress stays in this browser</span>
</nav>

<main>
  <section id="view-ledger" class="view is-active" aria-label="Trophy ledger">
    <aside class="pane pane-left">
      <div class="pane-head"><h2>Checklist</h2><span id="list-count" class="pane-count"></span></div>
      <div id="filter-chips" class="chips"></div>
      <label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="Search the ledger…" autocomplete="off"></label>
      <div id="trophy-list" class="trophy-list"></div>
    </aside>
    <article id="detail" class="pane pane-center" aria-live="polite"></article>
    <aside class="pane pane-right">
      <div id="roadmap-summary" class="rail-block"></div>
      <div id="watchlist" class="rail-block"></div>
      <div id="collectibles-summary" class="rail-block"></div>
    </aside>
  </section>

  <section id="view-roadmap" class="view" aria-label="Platinum roadmap">
    <div class="wide-grid">
      <article id="roadmap-view" class="pane pane-wide"></article>
      <aside id="roadmap-watchlist" class="pane pane-side"></aside>
    </div>
  </section>

  <section id="view-collectibles" class="view" aria-label="Collectibles tables">
    <div class="wide-grid single">
      <article id="collectibles-view" class="pane pane-wide"></article>
    </div>
  </section>
</main>

<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
